<!DOCTYPE html>
<html>
<head>
 <title>Europeana Datasets</title>
 <style>
  body {
   font-family: sans-serif;
   padding: 20px;
   background-color: #f0f2f5;
   color: #333;
  }

  .file-list { list-style: none; padding: 0; }
  .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #fafafa; }

  .file-info { flex-grow: 1; }
  .file-name { font-weight: 600; color: #202124; }
  .file-meta { font-size: 0.85em; color: #70757a; margin-top: 4px; }
  .controls { display: flex; gap: 10px; align-items: center; }
  .btn { padding: 6px 14px; border-radius: 4px; border: none; cursor: pointer; font-weight: 500; transition: opacity 0.2s; }
  .btn-download { background-color: #1a73e8; color: white; }
  .btn-stop { background-color: #d93025; color: white; display: none; }
  .status { font-size: 0.8em; font-weight: bold; min-width: 80px; text-align: right; }

 </style>
</head>
<body>
<!--<H1>This page shows list of downloadable datasets.</H1>
<div id="item-container">Loading items...</div> -->

<h2>Download Datasets</h2>
<ul id="dataset-container"></ul>

<script>

 let downloadController;
 async function fetchFileDetails(){
  const container = document.getElementById('dataset-container');
  container.innerHTML = '<li>Loading...</li>';

  try {
  <!-- Get the response -->
  const response = await fetch('/dataset/');
  const data = await response.json();
   container.innerHTML = '';

   for (const datasetID in data) {
    //create list item for each dataset which has all type of downloadable file details

    const groupLi = document.createElement('li');
    groupLi.className = 'dataset-group';

    let fileHtml = ''
    data[datasetID].forEach(file => {

     fileHtml += `
      <li class="file-item">
        <div class="file-info">
          <div class="file-name">${file.fileName}.${file.contentType}</div>
           <div class="file-meta">
           Size: ${file.fileSize} | Modified: ${new Date(file.lastModified).toLocaleString()}
           </div>
        </div>
         <div class="controls">
         <span class="status"></span>
            <button class="btn btn-download" onclick="startDownload('${file.downloadURL}', this)">Download</button>
             <button class="btn btn-stop" onclick="stopDownload(this)">Stop</button>
         </div>
      </li>
     `;

    });

    groupLi.innerHTML = `
                        <div class="dataset-id">Dataset ${datasetID}</div>
                        <ul class="file-list">${fileHtml}</ul>
                    `;
    container.appendChild(groupLi);

   }
  } catch (error) {
   container.innerHTML = '<li style="color:red;">Failed to connect to API.</li>';
  }

 }


 async function startDownload(url, btn) {
  //programmatically create an anchor element and then start downloading by clicking on it ,adjust the downloaded file name

  const controls = btn.parentElement;
  const stopBtn = controls.querySelector('.btn-stop');
  const status = controls.querySelector('.status');

  btn.style.display = 'none';
  stopBtn.style.display = 'inline-block';
  status.innerText = "WAITING...";

  downloadController = new AbortController();

  try {
   const response = await fetch(url, { method: 'get', signal: downloadController.signal });
   const reader = response.body.getReader();

   if (!response.ok) {
    // This catches 404, 500, 403, etc.
    throw new Error(`HTTP ${response.status}`);
   }


   status.innerText = "DOWNLOADING...";

   // To truly "download" while handling a stop,  process the stream
   const chunks = [];
   while(true) {
    const {done, value} = await reader.read();
    if (done) break;
    chunks.push(value);
   }

   const blob = new Blob(chunks);
   const dlUrl = window.URL.createObjectURL(blob);
   const a = document.createElement('a');
   a.href = dlUrl;
   let filename = url.split('/').pop();
   let newFilename = filename.replace(/\.[^/.]+$/, "") + ".zip";
   a.download = newFilename;
   a.click();

   status.innerText = "FINISHED";
   reset(btn, stopBtn);
  } catch (err) {
   status.innerText = err.name === 'AbortError' ? "STOPPED" : "ERROR";
   reset(btn, stopBtn);
  }

 }
 function stopDownload(stopBtn) {
  if (downloadController) downloadController.abort();
 }

 function reset(dlBtn, stopBtn) {
  dlBtn.style.display = 'inline-block';
  stopBtn.style.display = 'none';
 }

 window.onload = fetchFileDetails;
</script>

</body>
</html>

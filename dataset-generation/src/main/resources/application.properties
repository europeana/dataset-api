spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#Force schema initialization explicitly
spring.sql.init.mode=always
spring.batch.jdbc.initialize-schema=always
#this ensures spring loads org/springframework/batch/core/schema-h2.sql
spring.batch.jdbc.platform=h2

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

#to check start up logs
#must see - Executing SQL script from class path resource [org/springframework/batch/core/schema-h2.sql]
#logging.level.org.springframework.batch=DEBUG
#logging.level.org.springframework.jdbc.datasource.init=DEBUG

#INitialisaztion order
#1. DataSource created
#2. schema.sql executed
#3. JPA tables created
#4. Spring Batch schema created
#5. Application runs